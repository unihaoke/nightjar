name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景 / 要解决的问题
      description: 这个建议试图解决什么问题？当前有什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望它如何工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 有没有考虑过其它实现方式？
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 相关截图、参考实现或设计文档章节。
    validations:
      required: false
