name: Bug 报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写完整，缺失的信息会显著拖慢定位速度。
        ⚠️ 请勿粘贴真实密码、密钥、生产地址等敏感信息。
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么？期望的行为是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 尽量给出最小可复现步骤（命令、页面路径、参数等）。
      placeholder: |
        1. ...
        2. ...
        3. 实际结果 / 期望结果
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: 涉及模块
      options:
        - 后端（middleware-ops）
        - 前端（middleware-ops-web）
        - 部署（deploy / docker-compose）
        - 文档（docs）
        - 不确定
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: 分支或 commit、部署方式（Docker Compose / 本地）。
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 相关日志、报错堆栈或截图（请先脱敏）。
      render: shell
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: 运行环境
      description: 操作系统、Go / Node 版本、浏览器（如涉及前端）。
