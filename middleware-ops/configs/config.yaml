# 中间件智能问题解决平台 · 默认配置
#
# 加载优先级：环境变量（MWOPS_ 前缀）> 配置文件 > 内置默认值。
# 环境变量写法：层级用下划线连接，例如 MWOPS_DATABASE_HOST、MWOPS_JWT_SECRET。
#
# 本文件即「单机零外部依赖可启动」的最小配置：
#   - 仅需 PostgreSQL（平台元数据库）；
#   - Redis 缺省为空 → 自动降级为进程内缓存与队列；
#   - Prometheus 缺省为空 → 监控数据源禁用：页面显示「无数据」，平台只使用真实数据；
#   - AI 引擎缺省 hybrid + mock → 规则引擎兜底，接入 LLM 只需填 base_url/api_key。

app:
  name: middleware-ops
  version: 1.0.0
  # debug / release；release 下强制校验 jwt.secret 长度
  mode: debug

server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 30s
  # 0 表示不限制写超时（SSE 流式诊断需要）
  write_timeout: 0s
  shutdown_timeout: 15s
  trusted_proxies:
    - 127.0.0.1
    - ::1
  rate_limit_per_minute: 600

database:
  host: 127.0.0.1
  port: 5432
  user: mwo
  password: mwo
  name: middleware_ops
  ssl_mode: disable
  time_zone: UTC
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime_minutes: 60
  auto_migrate: true

redis:
  # 留空 = 单机模式（进程内缓存 + 内存队列）
  addr: ""
  password: ""
  db: 0
  pool_size: 20
  dial_timeout: 3s
  read_timeout: 3s
  write_timeout: 3s
  stream_key: mwops:ai:tasks
  group: mwops-ai-workers
  # AI 任务单实例并发上限（与 guardrail.max_concurrency 语义一致）
  queue_workers: 4
  fallback_to_memory: true

jwt:
  # 生产必须替换为 ≥32 位随机字符串
  secret: dev-only-secret-please-change-in-release-mode
  issuer: middleware-ops
  access_ttl: 8h
  refresh_ttl: 168h
  cookie_name: mwops_token
  cookie_secure: false
  # lax / strict / none
  cookie_same_site: lax
  # 首次启动自动创建的管理员账号，登录后请立即改密
  bootstrap_admin: admin
  bootstrap_password: Admin@12345

security:
  # 主密钥：优先使用环境变量 MWOPS_SECURITY_MASTER_KEY；否则读取/生成该文件（0600）
  master_key_file: ./data/master.key
  master_key: ""
  master_key_rotation_days: 90
  # 出网白名单：默认空 = 禁止任何第三方 AI 分析（6.5）
  outbound_whitelist: []
  # 追加敏感词正则（内置已覆盖 IP/手机号/请求 ID/路径/邮箱/凭据）
  sensitive_patterns: []
  code_snippet_max_lines: 200

ai_engine:
  # third_party / self_hosted / hybrid
  #
  # 注意：api_key 已改由平台「系统设置 → AI 设置」管理（AES-256-GCM 加密落库，改完即时生效）。
  # 这里保留字段仅作两层兜底：
  #   1) 首次启动时若平台库里还没有 AI 设置，且这里配了非空 key，平台会把它导入库并在日志里说明；
  #   2) 平台库读取/解密失败时，引擎按本文件的值装配，保证诊断链路不至于完全不可用。
  # 因此**升级后不要再往这里填 key**——填了也只在"库里没有记录"那一次生效，之后以平台库为准。
  strategy: hybrid
  third_party:
    enabled: false
    # openai / anthropic / mock
    kind: openai
    base_url: https://api.deepseek.com/v1
    # 已改由平台「AI 设置」管理（此处仅作首次导入的兜底）
    api_key: ""
    model: deepseek-chat
    max_tokens: 2048
    price_per_k_token: 0.002
    timeout:
      connect: 5s
      first_byte: 15s
      total: 60s
      tool_call: 10s
      task_deadline: 120s
  self_hosted:
    enabled: true
    # mock 表示使用进程内确定性引擎（离线演示）；本地 LLM 填 ollama/vllm 的 base_url
    kind: mock
    base_url: http://127.0.0.1:11434/v1
    # 已改由平台「AI 设置」管理（此处仅作首次导入的兜底）
    api_key: ""
    model: qwen2.5:7b
    max_tokens: 2048
    price_per_k_token: 0
    timeout:
      connect: 5s
      first_byte: 15s
      total: 60s
      tool_call: 10s
      task_deadline: 120s
  fallback:
    # 第三方连续失败 N 次触发熔断并降级
    failure_threshold: 2
    open_duration: 60s
    rules_engine_enabled: true

prometheus:
  # 留空 = 未接入 Prometheus（页面显示「无数据」）。平台**只使用真实数据**，不提供任何模拟指标。
  base_url: ""
  timeout: 8s
  cache_ttl: 15s
  retention: 360h
  exporter_job_prefix: middleware-exporter

# ---------------------------------------------------------------------------
# 集成中心：在页面上选组件（Redis/MySQL/...）、填地址与账号，平台自动完成
# 「Exporter 暴露 → Prometheus 抓取 → 实例纳管 → 推荐告警规则」。
# 详见 docs/INTEGRATION.md。
# ---------------------------------------------------------------------------
integration:
  enabled: true
  # 副产物目录（file_sd 文件）：平台自带 Prometheus 走 HTTP 服务发现，
  # 该文件用于人工核对/审计，或交给无法访问平台接口的外部 Prometheus。
  # 容器内默认 /app/data/integrations（落在 backend-data 卷内，属主正确）。
  output_dir: ./data/integrations
  # file_sd 文件名。
  file_sd_name: integrations.json
  # 服务发现只读令牌；留空表示不鉴权（接口只暴露地址与标签，不含口令）。
  sd_token: ""
  # file_sd 抓取任务名：集成的纳管实例 prom_job 会写成该值。
  # 必须等于 deploy/prometheus/prometheus.yml 里 middleware-integration 这个 job_name。
  job_name: middleware-integration
  # 集成成功后自动创建模板内的推荐告警规则。
  auto_rules: true
  # 一键拉起 Exporter 容器：需要挂载 docker.sock，默认关闭（安全优先）。
  docker_enabled: false
  docker_host: unix:///var/run/docker.sock
  # Exporter 容器加入的网络（逗号分隔）：第一个是监控面（Prometheus 所在网络）。
  # 目标容器（数据面）所在的网络**不需要**写在这里——集成时平台会自动发现并接入。
  exporter_network: mwops
  # 新建集成的默认环境（数据权限按 dev/staging/prod 隔离）。
  default_environment: dev

# ---------------------------------------------------------------------------
# 日志总线 Kafka（「日志集成」：目标机 Filebeat → 平台 Kafka → 平台消费）
# 详见 docs/LOG_INTEGRATION.md。
#
# 两套地址别混：
#   brokers       = 平台自己消费的地址（容器网络内的 INTERNAL 监听器）
#   external_host = **被管服务器上的 Filebeat** 要连的地址（宿主可达地址）
# external_host 填 localhost 只有"平台与被管机同一台"时才对；否则 Filebeat 会
# 连上又立刻断开（Kafka 把它引导到它自己的 127.0.0.1）。日志集成自检第 3 步查这个。
# ---------------------------------------------------------------------------
kafka:
  enabled: true
  # 平台侧 bootstrap；compose 里通过 MWOPS_KAFKA_BROKERS 注入 kafka:29092。
  # 留空即视为"未启用日志接入"（平台照常启动，只是日志集成不可用）。
  brokers: []
  log_topic: mwops-logs
  group_id: mwops-log-ingest
  client_id: mwops-backend
  # 被管服务器接入地址（写进 filebeat.yml 的 hosts），须与 compose 的
  # KAFKA_ADVERTISED_LISTENERS 里 EXTERNAL 完全一致。
  external_host: 127.0.0.1
  external_port: 9092
  filebeat_version: 8.16.0
  # 单条日志消息上限：堆栈可能很长，与 Filebeat 的 max_message_bytes 同量级。
  max_bytes: 10485760
  session_timeout: 30s
  commit_interval: 1s
  # earliest：首次消费从头开始（宁可重复，不漏）；latest：只消费新消息。
  start_offset: earliest

# ---------------------------------------------------------------------------
# 日志告警的后处理参数（默认值）
#
# 完整链路：Kafka → 按规则做去重/冷却 → 落库 → 本段参数驱动的后处理
#   （外发通知渠道 + 拉取代码仓库 + AI 分析定位代码）
# 规则表 log_alert_rules 负责"按服务/指纹细化"，这里是没有命中规则时的兜底，
# 也是"零配置也能跑通"的保证。详见 docs/LOG_INTEGRATION.md。
# ---------------------------------------------------------------------------
log_alert:
  # 去重窗口（分钟）：窗口内同指纹只合并计数，不重复记录
  default_dedup_window: 5
  # 冷却期（分钟）：冷却内不重复通知、不重复触发 AI（事件仍记录）
  default_cooldown: 10
  default_ai_enabled: true
  # 默认通知渠道（留空 = 用「通知渠道」里已启用的渠道）
  default_notify_channels: []
  # 后处理扫描间隔与每轮批量：AI 分析很贵，靠这两个值限流
  worker_interval_seconds: 15
  worker_batch: 10
  analyze_timeout: 2m

# ---------------------------------------------------------------------------
# AI 分析用的代码仓库本地缓存（首次 clone，之后更新到远端）
#
# 为什么要有这件事：AI 要回答"日志里的错误对应哪一行代码"，就必须先把代码拉下来。
# 缓存目录落在 backend-data 卷里，容器重建不丢；下次分析只做增量更新。
# ---------------------------------------------------------------------------
code_repo:
  cache_dir: ./data/repos
  clone_timeout: 10m
  pull_timeout: 2m
  # 同一仓库两次拉取的最小间隔（秒）：故障风暴期间避免反复拉远端
  refresh_interval_seconds: 300
  # 是否允许平台从代码托管拉取代码（与 CodeRepo.allow_third_party 是两件事：
  # 后者管"能否把代码片段发给第三方 AI"，本项管"能否 git clone/pull"，内网 GitLab 也该允许）
  allow_outbound: true

notify:
  # webhook / secret / password 已改由平台「系统设置 → 通知设置」管理（加密落库、保存即生效）。
  # 这里保留字段仅作兜底：首次启动时平台会把这里的非空值导入库（并在日志里说明），
  # 之后一律以平台库为准——否则会出现"界面改完、重启又变回 .env 旧值"。
  enabled: true
  feishu:
    enabled: false
    # 已改由平台「通知设置」管理（此处仅作首次导入的兜底）
    webhook: ""
    secret: ""
  wecom:
    enabled: false
    # 已改由平台「通知设置」管理（此处仅作首次导入的兜底）
    webhook: ""
    secret: ""
  dingtalk:
    enabled: false
    # 已改由平台「通知设置」管理（此处仅作首次导入的兜底）
    webhook: ""
    secret: ""
  email:
    enabled: false
    host: ""
    port: 465
    username: ""
    # 已改由平台「通知设置」管理（此处仅作首次导入的兜底）
    password: ""
    from: ""
    to: []
    use_tls: true
  # IM 卡片「查看详情」回跳路径（执行统一回 Web 端，不做一键执行）
  card_confirm_path: /alerts

guardrail:
  # ① 上下文预算（5.2）
  input_token_budget: 8192
  output_token_budget: 2048
  log_context_lines: 20
  max_log_sources: 5
  max_code_files: 5
  code_lines_per_file: 200
  # ② 防死循环（5.3）
  max_steps: 8
  loop_repeat_threshold: 2
  llm_retry: 2
  # ⑥ 成本治理（5.7）
  cache_ttl: 24h
  daily_token_quota: 2000000
  per_user_daily_token_quota: 200000
  max_concurrency: 4
  vector_reference_threshold: 0.78
  # ④ SQL 规则校验（5.5）
  sql_default_limit: 100
  sql_max_limit: 1000
  sql_table_allowlist:
    - information_schema.tables
    - pg_stat_activity
    - pg_stat_statements

scheduler:
  enabled: true
  health_probe_interval: 60s
  metric_rule_eval_interval: 30s
  alert_cluster_interval: 5m
  # 每日 00:10 生成审计哈希链快照（6.4）
  audit_snapshot_cron: "0 10 0 * * *"
  approval_expire_interval: 1m

log:
  level: info
  file_path: ./data/logs/middleware-ops.log
  max_size_mb: 64
  max_backups: 10
  max_age_days: 30
  console: true
