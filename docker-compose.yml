# 中间件智能问题解决平台 · 一键部署（Docker Compose）
#
# 必装组件（设计文档 2.3）：PostgreSQL 15 + pgvector、Redis、Prometheus、Nginx、平台服务。
# Kafka 默认启用：它是「日志集成」的日志总线（被管服务器上的 Filebeat 推到这里，
# 平台后端按消费组消费），见 docs/LOG_INTEGRATION.md。
# 其余可选组件（MinIO / VictoriaMetrics）默认不启用，规模触发时再打开。
#
# 使用方式：
#   1. cp .env.example .env 并修改密码与密钥；
#   2. docker compose up -d --build；
#   3. 浏览器访问 http://<host>:8000 ，使用 .env 中的管理员账号登录。

name: middleware-ops

services:
  # ---------------------------------------------------------------------------
  # 平台数据库：PostgreSQL 15 + pgvector（元数据 / 告警 / 诊断 / 知识 / 审计）
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg15
    container_name: mwops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-mwo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mwo_change_me}
      POSTGRES_DB: ${DB_NAME:-middleware_ops}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 初始化脚本：仅创建扩展（pgvector / pg_trgm），不建表。
      # 表结构由后端 GORM AutoMigrate 负责，避免两套建表来源产生唯一约束名冲突。
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-mwo} -d ${DB_NAME:-middleware_ops}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [mwops]

  # ---------------------------------------------------------------------------
  # 平台缓存：会话 / 去重指纹 / Redis Stream 任务队列 / AI 结果缓存
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mwops-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-redis_change_me}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis_change_me}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [mwops]

  # ---------------------------------------------------------------------------
  # 日志总线：Kafka（KRaft 单节点，无 ZooKeeper）
  #
  # 用途：接收被管服务器上 Filebeat 推送的日志（docs/LOG_INTEGRATION.md）。
  # 三个监听器分工必须分清楚，否则被管机连不上：
  #   CONTROLLER :9093  仅容器网络，KRaft 仲裁用，不对外
  #   INTERNAL   :29092 仅容器网络，平台后端消费用（brokers 填 kafka:29092）
  #   EXTERNAL   :9092  暴露到宿主，**被管服务器上的 Filebeat 用这个端口**
  #
  # 【最容易配错的一处】KAFKA_ADVERTISED_LISTENERS 里的 EXTERNAL 地址必须是
  # **被管机能访问到的平台地址**（宿主 IP 或域名），不能是 localhost、也不能是容器名。
  # 配错时的现象极具迷惑性：Filebeat 能连上 9092、握手成功，但拿到 broker 元数据后
  # 立刻断开并报 `dial tcp 127.0.0.1:9092: connect: connection refused` ——
  # 因为它被引导去了它自己那台机器的 127.0.0.1。
  # 日志集成的自检第 3 步专门探测这个地址（在目标机上执行连通性检查）。
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: mwops-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-127.0.0.1}:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # 显式指定数据目录并挂卷：不指定时会落在容器临时目录，重启即丢日志
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # topic 自动创建：平台后端启动时也会幂等创建 mwops-logs，这里是双保险——
      # 否则"第一条日志到达时 topic 不存在"会被直接丢弃
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-3}
      # 日志是事件源不是归档：Kafka 只做削峰解耦，长期留存由平台的事件表承担
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-72}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # KRaft 集群 ID（16 字节 base64）；换 ID 等于换集群，已有数据卷会被拒绝挂载
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - '${KAFKA_PORT:-9092}:9092'
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [mwops]

  # ---------------------------------------------------------------------------
  # 指标存储：Prometheus（平台自身指标 + 被管中间件 Exporter）
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: mwops-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # 指标保留 15 天（设计文档 4.2 / 10）
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    # 主机监控（node_exporter）的地址常填 127.0.0.1，而 Prometheus 在容器里，
    # 127.0.0.1 会指向它自己。平台会把回环地址改写成 host.docker.internal，
    # 这里用 host-gateway 把它映射到宿主（Linux 上必须显式配置）。
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks: [mwops]

  # ---------------------------------------------------------------------------
  # 监控大盘：Grafana（平台统一托管）
  #
  # 被管项目**不再需要自带 Prometheus/Grafana**：Exporter 由「集成中心」拉起、
  # 抓取由本平台的 Prometheus 负责、大盘在这里看。数据源由 provisioning 自动注入
  # （见 deploy/grafana/provisioning/），大盘 JSON 放进 deploy/grafana/dashboards/ 即生效。
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.2
    container_name: mwops-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      # 允许被 iframe 嵌入平台页面（同源代理场景）
      GF_SECURITY_ALLOW_EMBEDDING: 'true'
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '${GRAFANA_PORT:-3000}:3000'
    networks: [mwops]

  # ---------------------------------------------------------------------------
  # 后端：模块化单体（Go）
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./middleware-ops
      dockerfile: Dockerfile
      args:
        # 需要 pgvector 原生类型与 HNSW 索引时改为 pgvector
        GO_BUILD_TAGS: ${GO_BUILD_TAGS:-}
        # 远程安装 Exporter（Ansible）：默认构建进镜像（远程是默认部署路径）。
        # 只做本机 Docker 部署时设 WITH_ANSIBLE=false 可让镜像小约 200MB。
        WITH_ANSIBLE: ${WITH_ANSIBLE:-true}
        # 国内构建慢时可换成阿里/清华源，例如 mirrors.aliyun.com 或 mirrors.tuna.tsinghua.edu.cn
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
    container_name: mwops-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Kafka 只要求"已启动"（service_started），不等它 healthy：
      # 它是「日志集成」的依赖，不是平台启动的依赖——Kafka 慢一点或暂时不可用，
      # 平台其余功能必须照常可用（后端启动时连不上 Kafka 只写一条说明，消费者持续重试）。
      kafka:
        condition: service_started
    environment:
      MWOPS_APP_MODE: ${APP_MODE:-release}
      MWOPS_SERVER_HOST: 0.0.0.0
      MWOPS_SERVER_PORT: '8080'
      MWOPS_DATABASE_HOST: postgres
      MWOPS_DATABASE_PORT: '5432'
      MWOPS_DATABASE_USER: ${DB_USER:-mwo}
      MWOPS_DATABASE_PASSWORD: ${DB_PASSWORD:-mwo_change_me}
      MWOPS_DATABASE_NAME: ${DB_NAME:-middleware_ops}
      MWOPS_DATABASE_AUTO_MIGRATE: 'true'
      MWOPS_REDIS_ADDR: redis:6379
      MWOPS_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_change_me}
      # 指标数据源：平台自带 Prometheus（集成中心创建的 Exporter 由它抓取）
      # 只在接入「外部已有 Prometheus」时才需要覆盖
      MWOPS_PROMETHEUS_BASE_URL: ${MWOPS_PROMETHEUS_BASE_URL:-http://prometheus:9090}
      MWOPS_JWT_SECRET: ${JWT_SECRET:?请设置 JWT_SECRET（≥32 位随机字符串）}
      MWOPS_JWT_BOOTSTRAP_ADMIN: ${ADMIN_USER:-admin}
      MWOPS_JWT_BOOTSTRAP_PASSWORD: ${ADMIN_PASSWORD:?请设置 ADMIN_PASSWORD}
      MWOPS_SECURITY_MASTER_KEY: ${MASTER_KEY:-}
      MWOPS_SECURITY_OUTBOUND_WHITELIST: ${OUTBOUND_WHITELIST:-}
      MWOPS_AI_ENGINE_STRATEGY: ${AI_STRATEGY:-hybrid}
      MWOPS_AI_ENGINE_THIRD_PARTY_ENABLED: ${THIRD_PARTY_ENABLED:-false}
      MWOPS_AI_ENGINE_THIRD_PARTY_BASE_URL: ${THIRD_PARTY_BASE_URL:-}
      MWOPS_AI_ENGINE_THIRD_PARTY_API_KEY: ${THIRD_PARTY_API_KEY:-}
      MWOPS_AI_ENGINE_THIRD_PARTY_MODEL: ${THIRD_PARTY_MODEL:-deepseek-chat}
      MWOPS_AI_ENGINE_SELF_HOSTED_ENABLED: ${SELF_HOSTED_ENABLED:-true}
      MWOPS_AI_ENGINE_SELF_HOSTED_KIND: ${SELF_HOSTED_KIND:-mock}
      MWOPS_AI_ENGINE_SELF_HOSTED_BASE_URL: ${SELF_HOSTED_BASE_URL:-}
      MWOPS_AI_ENGINE_SELF_HOSTED_MODEL: ${SELF_HOSTED_MODEL:-qwen2.5:7b}
      MWOPS_NOTIFY_FEISHU_WEBHOOK: ${FEISHU_WEBHOOK:-}
      MWOPS_NOTIFY_WECOM_WEBHOOK: ${WECOM_WEBHOOK:-}
      MWOPS_NOTIFY_FEISHU_ENABLED: ${FEISHU_ENABLED:-false}
      MWOPS_NOTIFY_WECOM_ENABLED: ${WECOM_ENABLED:-false}
      MWOPS_LOG_LEVEL: ${LOG_LEVEL:-info}
      MWOPS_HOOK_TOKEN: ${HOOK_TOKEN:-}
      # ---------- 日志总线 Kafka（日志集成：Filebeat → Kafka → 平台消费）----------
      # brokers 用 INTERNAL 监听器（容器网络内的 kafka:29092）；
      # external_host/port 是被管服务器上 Filebeat 要连的地址，必须与 compose 里
      # KAFKA_ADVERTISED_LISTENERS 的 EXTERNAL 完全一致，否则自检第 3 步会红。
      MWOPS_KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      MWOPS_KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:29092}
      MWOPS_KAFKA_LOG_TOPIC: ${KAFKA_LOG_TOPIC:-mwops-logs}
      MWOPS_KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-mwops-log-ingest}
      MWOPS_KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-mwops-backend}
      MWOPS_KAFKA_EXTERNAL_HOST: ${KAFKA_ADVERTISED_HOST:-127.0.0.1}
      MWOPS_KAFKA_EXTERNAL_PORT: '${KAFKA_PORT:-9092}'
      MWOPS_KAFKA_FILEBEAT_VERSION: ${FILEBEAT_VERSION:-8.16.0}
      # ---------- 日志告警后处理与代码仓库缓存 ----------
      # 告警规则（去重窗口/冷却期/通知渠道/AI 开关）一律在页面新增后才生效，此处只有限流参数。
      MWOPS_LOG_ALERT_WORKER_INTERVAL_SECONDS: ${LOG_ALERT_WORKER_INTERVAL:-15}
      MWOPS_LOG_ALERT_WORKER_BATCH: ${LOG_ALERT_WORKER_BATCH:-10}
      MWOPS_LOG_ALERT_ANALYZE_TIMEOUT: ${LOG_ALERT_ANALYZE_TIMEOUT:-2m}
      # ---------- 外部 AI 分析服务（日志告警用）：提交问题 → 回调/轮询 → 结论 ----------
      # 平台不再 clone 任何代码仓库：代码分析交给专门的 AI 服务完成。
      # CALLBACK_URL 必须是 AI 服务能访问到的平台地址（反向代理后要填对外域名）。
      MWOPS_AI_ANALYSIS_ENABLED: ${AI_ANALYSIS_ENABLED:-false}
      MWOPS_AI_ANALYSIS_BASE_URL: ${AI_ANALYSIS_BASE_URL:-}
      MWOPS_AI_ANALYSIS_API_KEY: ${AI_ANALYSIS_API_KEY:-}
      MWOPS_AI_ANALYSIS_SUBMIT_PATH: ${AI_ANALYSIS_SUBMIT_PATH:-/v1/analyses}
      MWOPS_AI_ANALYSIS_QUERY_PATH: ${AI_ANALYSIS_QUERY_PATH:-/v1/analyses/{task_id}}
      MWOPS_AI_ANALYSIS_CALLBACK_URL: ${AI_ANALYSIS_CALLBACK_URL:-}
      MWOPS_AI_ANALYSIS_CALLBACK_TOKEN: ${AI_ANALYSIS_CALLBACK_TOKEN:-}
      MWOPS_AI_ANALYSIS_TASK_TIMEOUT: ${AI_ANALYSIS_TASK_TIMEOUT:-30m}
      MWOPS_AI_ANALYSIS_POLL_INTERVAL: ${AI_ANALYSIS_POLL_INTERVAL:-60s}
      # ---------- 集成中心（页面一键集成，见 docs/INTEGRATION.md）----------
      MWOPS_INTEGRATION_ENABLED: ${INTEGRATION_ENABLED:-true}
      MWOPS_INTEGRATION_OUTPUT_DIR: /app/data/integrations
      MWOPS_INTEGRATION_JOB_NAME: ${INTEGRATION_JOB_NAME:-middleware-integration}
      MWOPS_INTEGRATION_SD_TOKEN: ${INTEGRATION_SD_TOKEN:-}
      MWOPS_INTEGRATION_AUTO_RULES: ${INTEGRATION_AUTO_RULES:-true}
      # 一键拉起 Exporter/代建账号/日志采集：默认开启（docker.sock 已默认挂载）
      MWOPS_INTEGRATION_DOCKER_ENABLED: ${INTEGRATION_DOCKER_ENABLED:-true}
      MWOPS_INTEGRATION_DOCKER_HOST: ${INTEGRATION_DOCKER_HOST:-unix:///var/run/docker.sock}
      # 逗号分隔：第一个是监控面（Prometheus 所在网络）。
      # 目标容器所在的网络**不需要**写在这里：集成时会自动发现并接入。
      MWOPS_INTEGRATION_EXPORTER_NETWORK: ${INTEGRATION_EXPORTER_NETWORK:-middleware-ops_mwops}
      # 平台自身容器名：集成后平台会把自己也接进目标网络，以便做 TCP 健康探测
      MWOPS_SELF_CONTAINER: mwops-backend
      # ---------- 远程安装 Exporter（Ansible，见 deploy/ansible/README.md）----------
      # 默认开启（远程是默认部署路径）。它会在**别的机器**上执行命令：
      # 生产若要求更严，设为 false 并把 WITH_ANSIBLE 构建参数关掉即可（prod 环境本就走审批工单）。
      MWOPS_INTEGRATION_ALLOW_REMOTE_INSTALL: ${INTEGRATION_ALLOW_REMOTE_INSTALL:-true}
      MWOPS_INTEGRATION_ANSIBLE_ENABLED: ${INTEGRATION_ANSIBLE_ENABLED:-true}
      MWOPS_INTEGRATION_ANSIBLE_BINARY: ${INTEGRATION_ANSIBLE_BINARY:-ansible-playbook}
      # 临时 inventory / vars（含 SSH 凭据）的目录：用完即删
      MWOPS_INTEGRATION_ANSIBLE_INVENTORY_DIR: /app/data/ansible
      MWOPS_INTEGRATION_ANSIBLE_TIMEOUT: ${INTEGRATION_ANSIBLE_TIMEOUT:-15m}
      MWOPS_INTEGRATION_ANSIBLE_INSTALL_MODE: ${INTEGRATION_ANSIBLE_INSTALL_MODE:-docker}
      MWOPS_INTEGRATION_ANSIBLE_DOCKER_NETWORK: ${INTEGRATION_ANSIBLE_DOCKER_NETWORK:-host}
      MWOPS_INTEGRATION_ANSIBLE_INSTALL_DIR: ${INTEGRATION_ANSIBLE_INSTALL_DIR:-/opt/mwops-exporter}
      MWOPS_INTEGRATION_ANSIBLE_BECOME: ${INTEGRATION_ANSIBLE_BECOME:-true}
    volumes:
      - backend-data:/app/data
      # 集成中心的服务发现走 HTTP（Prometheus http_sd_configs 拉取
      # http://backend:8080/api/sd/integrations），因此不需要共享卷。
      # file_sd 文件作为副产物落在 backend-data 卷内：
      #   docker exec mwops-backend cat /app/data/integrations/integrations.json
      # docker.sock：**默认挂载**。集成中心的核心能力（自动发现目标容器所在网络、
      # 一键拉起 Exporter、代建只读监控账号、创建日志采集容器）都依赖它。
      # 安全边界：挂载 socket 等于把宿主机 root 权限交给平台容器；若合规不允许，
      # 注释掉下面这行并把 INTEGRATION_DOCKER_ENABLED 设为 false，平台退化为
      # 「只渲染配置 + 手工执行」模式（见 docs/INTEGRATION.md §4）。
      # 平台以非 root 用户运行（Dockerfile 里的 mwops），而宿主 socket 通常是
      # root:docker 0660——所以必须把宿主 docker 组的 GID 作为附加组加进来，
      # 否则会报 "dial unix /var/run/docker.sock: connect: permission denied"。
      # DOCKER_GID 由 scripts/onboard.sh 自动探测写入，也可手工设置：
      #   stat -c '%g' /var/run/docker.sock
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
        - "${DOCKER_GID:-999}"
    expose:
      - '8080'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/healthz']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks: [mwops]

  # ---------------------------------------------------------------------------
  # 前端 + 反向代理：Nginx 托管静态资源并代理 /api（含 SSE）
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./middleware-ops-web
      dockerfile: Dockerfile
    container_name: mwops-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${WEB_PORT:-8000}:80'
    volumes:
      - ./middleware-ops-web/nginx.conf:/etc/nginx/conf.d/middleware-ops.conf:ro
    networks: [mwops]

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  prometheus-data:
  backend-data:
  grafana-data:

networks:
  mwops:
    driver: bridge
