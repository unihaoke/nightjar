# 中间件智能问题解决平台 · 一键部署（Docker Compose）
#
# 必装组件（设计文档 2.3）：PostgreSQL 15 + pgvector、Redis、Prometheus、Nginx、平台服务。
# 可选组件（Kafka / MinIO / VictoriaMetrics）默认不启用，规模触发时再打开。
#
# 使用方式：
#   1. cp .env.example .env 并修改密码与密钥；
#   2. docker compose up -d --build；
#   3. 浏览器访问 http://<host>:8000 ，使用 .env 中的管理员账号登录。

name: middleware-ops

services:
  # ---------------------------------------------------------------------------
  # 平台数据库：PostgreSQL 15 + pgvector（元数据 / 告警 / 诊断 / 知识 / 审计）
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg15
    container_name: mwops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-mwo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mwo_change_me}
      POSTGRES_DB: ${DB_NAME:-middleware_ops}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 初始化脚本：仅创建扩展（pgvector / pg_trgm），不建表。
      # 表结构由后端 GORM AutoMigrate 负责，避免两套建表来源产生唯一约束名冲突。
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-mwo} -d ${DB_NAME:-middleware_ops}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [mwops]

  # ---------------------------------------------------------------------------
  # 平台缓存：会话 / 去重指纹 / Redis Stream 任务队列 / AI 结果缓存
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mwops-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-redis_change_me}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis_change_me}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [mwops]

  # ---------------------------------------------------------------------------
  # 指标存储：Prometheus（平台自身指标 + 被管中间件 Exporter）
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: mwops-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # 指标保留 15 天（设计文档 4.2 / 10）
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    networks: [mwops]

  # ---------------------------------------------------------------------------
  # 监控大盘：Grafana（平台统一托管）
  #
  # 被管项目**不再需要自带 Prometheus/Grafana**：Exporter 由「集成中心」拉起、
  # 抓取由本平台的 Prometheus 负责、大盘在这里看。数据源由 provisioning 自动注入
  # （见 deploy/grafana/provisioning/），大盘 JSON 放进 deploy/grafana/dashboards/ 即生效。
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.2
    container_name: mwops-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      # 允许被 iframe 嵌入平台页面（同源代理场景）
      GF_SECURITY_ALLOW_EMBEDDING: 'true'
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '${GRAFANA_PORT:-3000}:3000'
    networks: [mwops]

  # ---------------------------------------------------------------------------
  # 后端：模块化单体（Go）
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./middleware-ops
      dockerfile: Dockerfile
      args:
        # 需要 pgvector 原生类型与 HNSW 索引时改为 pgvector
        GO_BUILD_TAGS: ${GO_BUILD_TAGS:-}
    container_name: mwops-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MWOPS_APP_MODE: ${APP_MODE:-release}
      MWOPS_SERVER_HOST: 0.0.0.0
      MWOPS_SERVER_PORT: '8080'
      MWOPS_DATABASE_HOST: postgres
      MWOPS_DATABASE_PORT: '5432'
      MWOPS_DATABASE_USER: ${DB_USER:-mwo}
      MWOPS_DATABASE_PASSWORD: ${DB_PASSWORD:-mwo_change_me}
      MWOPS_DATABASE_NAME: ${DB_NAME:-middleware_ops}
      MWOPS_DATABASE_AUTO_MIGRATE: 'true'
      MWOPS_REDIS_ADDR: redis:6379
      MWOPS_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_change_me}
      # 指标数据源：平台自带 Prometheus（集成中心创建的 Exporter 由它抓取）
      # 只在接入「外部已有 Prometheus」时才需要覆盖
      MWOPS_PROMETHEUS_BASE_URL: ${MWOPS_PROMETHEUS_BASE_URL:-http://prometheus:9090}
      MWOPS_JWT_SECRET: ${JWT_SECRET:?请设置 JWT_SECRET（≥32 位随机字符串）}
      MWOPS_JWT_BOOTSTRAP_ADMIN: ${ADMIN_USER:-admin}
      MWOPS_JWT_BOOTSTRAP_PASSWORD: ${ADMIN_PASSWORD:?请设置 ADMIN_PASSWORD}
      MWOPS_SECURITY_MASTER_KEY: ${MASTER_KEY:-}
      MWOPS_SECURITY_OUTBOUND_WHITELIST: ${OUTBOUND_WHITELIST:-}
      MWOPS_AI_ENGINE_STRATEGY: ${AI_STRATEGY:-hybrid}
      MWOPS_AI_ENGINE_THIRD_PARTY_ENABLED: ${THIRD_PARTY_ENABLED:-false}
      MWOPS_AI_ENGINE_THIRD_PARTY_BASE_URL: ${THIRD_PARTY_BASE_URL:-}
      MWOPS_AI_ENGINE_THIRD_PARTY_API_KEY: ${THIRD_PARTY_API_KEY:-}
      MWOPS_AI_ENGINE_THIRD_PARTY_MODEL: ${THIRD_PARTY_MODEL:-deepseek-chat}
      MWOPS_AI_ENGINE_SELF_HOSTED_ENABLED: ${SELF_HOSTED_ENABLED:-true}
      MWOPS_AI_ENGINE_SELF_HOSTED_KIND: ${SELF_HOSTED_KIND:-mock}
      MWOPS_AI_ENGINE_SELF_HOSTED_BASE_URL: ${SELF_HOSTED_BASE_URL:-}
      MWOPS_AI_ENGINE_SELF_HOSTED_MODEL: ${SELF_HOSTED_MODEL:-qwen2.5:7b}
      MWOPS_NOTIFY_FEISHU_WEBHOOK: ${FEISHU_WEBHOOK:-}
      MWOPS_NOTIFY_WECOM_WEBHOOK: ${WECOM_WEBHOOK:-}
      MWOPS_NOTIFY_FEISHU_ENABLED: ${FEISHU_ENABLED:-false}
      MWOPS_NOTIFY_WECOM_ENABLED: ${WECOM_ENABLED:-false}
      MWOPS_LOG_LEVEL: ${LOG_LEVEL:-info}
      MWOPS_HOOK_TOKEN: ${HOOK_TOKEN:-}
      # ---------- 集成中心（页面一键集成，见 docs/INTEGRATION.md）----------
      MWOPS_INTEGRATION_ENABLED: ${INTEGRATION_ENABLED:-true}
      MWOPS_INTEGRATION_OUTPUT_DIR: /app/data/integrations
      MWOPS_INTEGRATION_JOB_NAME: ${INTEGRATION_JOB_NAME:-middleware-integration}
      MWOPS_INTEGRATION_SD_TOKEN: ${INTEGRATION_SD_TOKEN:-}
      MWOPS_INTEGRATION_AUTO_RULES: ${INTEGRATION_AUTO_RULES:-true}
      # 一键拉起 Exporter/代建账号/日志采集：默认开启（docker.sock 已默认挂载）
      MWOPS_INTEGRATION_DOCKER_ENABLED: ${INTEGRATION_DOCKER_ENABLED:-true}
      MWOPS_INTEGRATION_DOCKER_HOST: ${INTEGRATION_DOCKER_HOST:-unix:///var/run/docker.sock}
      # 逗号分隔：第一个是监控面（Prometheus 所在网络）。
      # 目标容器所在的网络**不需要**写在这里：集成时会自动发现并接入。
      MWOPS_INTEGRATION_EXPORTER_NETWORK: ${INTEGRATION_EXPORTER_NETWORK:-middleware-ops_mwops}
      # 平台自身容器名：集成后平台会把自己也接进目标网络，以便做 TCP 健康探测
      MWOPS_SELF_CONTAINER: mwops-backend
    volumes:
      - backend-data:/app/data
      # 集成中心的服务发现走 HTTP（Prometheus http_sd_configs 拉取
      # http://backend:8080/api/sd/integrations），因此不需要共享卷。
      # file_sd 文件作为副产物落在 backend-data 卷内：
      #   docker exec mwops-backend cat /app/data/integrations/integrations.json
      # docker.sock：**默认挂载**。集成中心的核心能力（自动发现目标容器所在网络、
      # 一键拉起 Exporter、代建只读监控账号、创建日志采集容器）都依赖它。
      # 安全边界：挂载 socket 等于把宿主机 root 权限交给平台容器；若合规不允许，
      # 注释掉下面这行并把 INTEGRATION_DOCKER_ENABLED 设为 false，平台退化为
      # 「只渲染配置 + 手工执行」模式（见 docs/INTEGRATION.md §4）。
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - '8080'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/healthz']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks: [mwops]

  # ---------------------------------------------------------------------------
  # 前端 + 反向代理：Nginx 托管静态资源并代理 /api（含 SSE）
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./middleware-ops-web
      dockerfile: Dockerfile
    container_name: mwops-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${WEB_PORT:-8000}:80'
    volumes:
      - ./middleware-ops-web/nginx.conf:/etc/nginx/conf.d/middleware-ops.conf:ro
    networks: [mwops]

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  backend-data:
  grafana-data:

networks:
  mwops:
    driver: bridge
