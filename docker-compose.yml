# 中间件智能问题解决平台 · 一键部署（Docker Compose）
#
# 必装组件（设计文档 2.3）：PostgreSQL 15 + pgvector、Redis、Prometheus、Nginx、平台服务。
# 可选组件（Kafka / MinIO / VictoriaMetrics）默认不启用，规模触发时再打开。
#
# 使用方式：
#   1. cp .env.example .env 并修改密码与密钥；
#   2. docker compose up -d --build；
#   3. 浏览器访问 http://<host>:8000 ，使用 .env 中的管理员账号登录。

name: middleware-ops

services:
  # ---------------------------------------------------------------------------
  # 平台数据库：PostgreSQL 15 + pgvector（元数据 / 告警 / 诊断 / 知识 / 审计）
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg15
    container_name: mwops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-mwo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mwo_change_me}
      POSTGRES_DB: ${DB_NAME:-middleware_ops}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 初始化脚本：仅创建扩展（pgvector / pg_trgm），不建表。
      # 表结构由后端 GORM AutoMigrate 负责，避免两套建表来源产生唯一约束名冲突。
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-mwo} -d ${DB_NAME:-middleware_ops}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [mwops]

  # ---------------------------------------------------------------------------
  # 平台缓存：会话 / 去重指纹 / Redis Stream 任务队列 / AI 结果缓存
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mwops-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-redis_change_me}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis_change_me}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [mwops]

  # ---------------------------------------------------------------------------
  # 指标存储：Prometheus（平台自身指标 + 被管中间件 Exporter）
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: mwops-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # 指标保留 15 天（设计文档 4.2 / 10）
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    networks: [mwops]

  # ---------------------------------------------------------------------------
  # 后端：模块化单体（Go）
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./middleware-ops
      dockerfile: Dockerfile
      args:
        # 需要 pgvector 原生类型与 HNSW 索引时改为 pgvector
        GO_BUILD_TAGS: ${GO_BUILD_TAGS:-}
    container_name: mwops-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MWOPS_APP_MODE: ${APP_MODE:-release}
      MWOPS_SERVER_HOST: 0.0.0.0
      MWOPS_SERVER_PORT: '8080'
      MWOPS_DATABASE_HOST: postgres
      MWOPS_DATABASE_PORT: '5432'
      MWOPS_DATABASE_USER: ${DB_USER:-mwo}
      MWOPS_DATABASE_PASSWORD: ${DB_PASSWORD:-mwo_change_me}
      MWOPS_DATABASE_NAME: ${DB_NAME:-middleware_ops}
      MWOPS_DATABASE_AUTO_MIGRATE: 'true'
      MWOPS_REDIS_ADDR: redis:6379
      MWOPS_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_change_me}
      MWOPS_PROMETHEUS_BASE_URL: http://prometheus:9090
      MWOPS_JWT_SECRET: ${JWT_SECRET:?请设置 JWT_SECRET（≥32 位随机字符串）}
      MWOPS_JWT_BOOTSTRAP_ADMIN: ${ADMIN_USER:-admin}
      MWOPS_JWT_BOOTSTRAP_PASSWORD: ${ADMIN_PASSWORD:?请设置 ADMIN_PASSWORD}
      MWOPS_SECURITY_MASTER_KEY: ${MASTER_KEY:-}
      MWOPS_SECURITY_OUTBOUND_WHITELIST: ${OUTBOUND_WHITELIST:-}
      MWOPS_AI_ENGINE_STRATEGY: ${AI_STRATEGY:-hybrid}
      MWOPS_AI_ENGINE_THIRD_PARTY_ENABLED: ${THIRD_PARTY_ENABLED:-false}
      MWOPS_AI_ENGINE_THIRD_PARTY_BASE_URL: ${THIRD_PARTY_BASE_URL:-}
      MWOPS_AI_ENGINE_THIRD_PARTY_API_KEY: ${THIRD_PARTY_API_KEY:-}
      MWOPS_AI_ENGINE_THIRD_PARTY_MODEL: ${THIRD_PARTY_MODEL:-deepseek-chat}
      MWOPS_AI_ENGINE_SELF_HOSTED_ENABLED: ${SELF_HOSTED_ENABLED:-true}
      MWOPS_AI_ENGINE_SELF_HOSTED_KIND: ${SELF_HOSTED_KIND:-mock}
      MWOPS_AI_ENGINE_SELF_HOSTED_BASE_URL: ${SELF_HOSTED_BASE_URL:-}
      MWOPS_AI_ENGINE_SELF_HOSTED_MODEL: ${SELF_HOSTED_MODEL:-qwen2.5:7b}
      MWOPS_NOTIFY_FEISHU_WEBHOOK: ${FEISHU_WEBHOOK:-}
      MWOPS_NOTIFY_WECOM_WEBHOOK: ${WECOM_WEBHOOK:-}
      MWOPS_NOTIFY_FEISHU_ENABLED: ${FEISHU_ENABLED:-false}
      MWOPS_NOTIFY_WECOM_ENABLED: ${WECOM_ENABLED:-false}
      MWOPS_LOG_LEVEL: ${LOG_LEVEL:-info}
      MWOPS_HOOK_TOKEN: ${HOOK_TOKEN:-}
    volumes:
      - backend-data:/app/data
    expose:
      - '8080'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/healthz']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks: [mwops]

  # ---------------------------------------------------------------------------
  # 前端 + 反向代理：Nginx 托管静态资源并代理 /api（含 SSE）
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./middleware-ops-web
      dockerfile: Dockerfile
    container_name: mwops-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${WEB_PORT:-8000}:80'
    volumes:
      - ./middleware-ops-web/nginx.conf:/etc/nginx/conf.d/middleware-ops.conf:ro
    networks: [mwops]

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  backend-data:

networks:
  mwops:
    driver: bridge
