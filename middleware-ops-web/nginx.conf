# Nginx 站点配置：静态资源 + API 反向代理 + SSE + 限流。
#
# 部署要点：
#   1. /api 反向代理到后端，SSE（AI 诊断流式）必须关闭缓冲；
#   2. 静态资源带哈希文件名，可长缓存；index.html 不缓存；
#   3. 应用层已有按用户/IP 限流，此处再兜一层按 IP 限流（8.1 双限流）。

upstream mwops_backend {
    server backend:8080;
    keepalive 32;
}

# 按 IP 限流：10r/s，突发 20
limit_req_zone $binary_remote_addr zone=mwops_api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 16m;
    server_tokens off;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 安全响应头（与后端保持一致）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # 健康检查直通后端（容器健康探测使用）
    location = /healthz {
        proxy_pass http://mwops_backend/healthz;
        access_log off;
    }

    # API 反向代理
    location /api/ {
        limit_req zone=mwops_api_limit burst=20 nodelay;

        proxy_pass http://mwops_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE / WebSocket 支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 前端路由（history 模式回退到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 构建产物带内容哈希，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

