# 日志采集 Agent · 自建模式配置样例
#
# 什么时候需要这个文件：
#   - 首选方案是平台的「集成中心 → 日志接入」：平台读被管容器的 docker 配置发现日志位置，
#     然后用平台镜像自建采集容器（被管项目零改动）。
#   - 只有当平台**无法访问 docker.sock**（拿不到对方容器配置）时，才需要在被管项目侧
#     自己跑一个 Agent —— 用本文件作配置。
#
# 构建与运行：
#   cd <nightjar>/middleware-ops && go build -o mwops-agent ./cmd/agent
#   ./mwops-agent -config agent.yaml
#
# 也可以用纯环境变量配置（不挂配置文件）：
#   MWOPS_AGENT_PLATFORM_URL=http://mwops-backend:8080
#   MWOPS_AGENT_HOOK_TOKEN=<与平台 HOOK_TOKEN 一致>
#   MWOPS_AGENT_SERVICE=interview-review-backend
#   MWOPS_AGENT_SERVER_NAME=interview-backend
#   MWOPS_AGENT_FILES="/logs/*.log:error:ERROR"     # 支持通配，分号分隔多条
#   MWOPS_AGENT_POSITION_FILE=/data/agent-position.json

# 平台地址（不含路径）
platform_url: http://mwops-backend:8080

# 上报令牌，与平台环境变量 MWOPS_HOOK_TOKEN 一致；留空表示平台未开启校验
hook_token: ""

# 默认服务名（各文件未单独指定时使用）
service: interview-review-backend

environment: dev
server_name: interview-backend

# 偏移量文件：记录每个日志文件的读取位置，避免重复上报（可放在数据盘）
position_file: /data/agent-position.json

# 错误前后采集的行数（设计文档 5.2 默认 20 行）
context_lines: 20

# 单轮上报条数上限
max_batch: 50

files:
  # 应用错误日志（logback 的 ERROR_FILE）。路径支持通配，轮转出的新文件也会被采到。
  - path: /logs/*.log
    alert_type: error
    service: interview-review-backend
    # 仅采集 ERROR 及以上；gc.log 这类无级别日志需要 INFO
    level_filter: ERROR

  # 需要 GC 诊断时再打开下面这条（建议先把 JVM 参数收敛为 -Xlog:gc，控制日志量）
  # - path: /logs/gc.log
  #   alert_type: gc
  #   service: interview-review-backend
  #   level_filter: INFO
