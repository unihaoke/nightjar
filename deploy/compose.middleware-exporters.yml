# 被管中间件接入（复用平台自带的 Prometheus 网络）
#
# 用途：在「平台已用根目录 docker-compose.yml 起好」的前提下，把测试/生产中间件的
# 官方 Exporter 接到平台自己的 Prometheus 上，避免为验证再单独搭一套 Prometheus。
#
# 使用方式：
#   docker compose -f docker-compose.yml -f deploy/compose.middleware-exporters.yml up -d
#
# 说明：
#   - 本文件是 **override**，不能单独启动，必须与根目录 docker-compose.yml 一起使用；
#   - Prometheus 抓取配置换成 deploy/prometheus/prometheus.with-exporters.yml；
#   - 若被管中间件部署在其他主机，把 `host.docker.internal:PORT` 换成实际地址即可；
#     Linux 下 host.docker.internal 需要 extra_hosts 映射（本文件已为 exporter 配好）。
#
# 标签约定（与平台实例纳管字段对应，务必一致）：
#   SERVICE_NAME 环境变量会被各 Exporter 作为 instance_name 标签上报，
#   平台纳管时若未填写「Prometheus instance」，就按 instance_name 匹配实例名。

services:
  # ---------------------------------------------------------------------------
  # Prometheus：换用包含 Exporter 抓取任务的配置
  # ---------------------------------------------------------------------------
  prometheus:
    volumes:
      - ./deploy/prometheus/prometheus.with-exporters.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

  # ---------------------------------------------------------------------------
  # Redis Exporter（端口 9121）
  #   被管目标：redis://<host>:<port>，需提供只读账号
  #   关键指标：redis_up / redis_memory_used_bytes / redis_connected_clients /
  #             redis_keyspace_hits_total / redis_keyspace_misses_total /
  #             redis_slowlog_length / redis_evicted_keys_total / redis_blocked_clients
  # ---------------------------------------------------------------------------
  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: mwops-redis-exporter
    restart: unless-stopped
    environment:
      # 被管 Redis 地址（可用逗号分隔多个：redis://a:6379,redis://b:6379）
      REDIS_ADDR: ${REDIS_TARGET_ADDR:-redis://host.docker.internal:6379}
      # 只读账号（未开启 ACL 时留空）
      REDIS_USER: ${REDIS_TARGET_USER:-}
      REDIS_PASSWORD: ${REDIS_TARGET_PASSWORD:-}
      # 该值会作为 instance_name 标签上报，需与平台纳管实例名一致
      SERVICE_NAME: ${REDIS_INSTANCE_NAME:-redis-dev-01}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${REDIS_EXPORTER_PORT:-9121}:9121'
    networks: [mwops]

  # ---------------------------------------------------------------------------
  # MySQL Exporter（端口 9104）
  #   被管目标：需预先创建只读监控账号
  #     CREATE USER 'exporter'@'%' IDENTIFIED BY 'xxx';
  #     GRANT PROCESS, REPLICATION CLIENT, SELECT ON *.* TO 'exporter'@'%';
  #   关键指标：mysql_global_status_queries / mysql_global_status_threads_connected /
  #             mysql_global_variables_max_connections / mysql_global_status_slow_queries /
  #             mysql_global_status_innodb_buffer_pool_reads 等
  # ---------------------------------------------------------------------------
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: mwops-mysqld-exporter
    restart: unless-stopped
    command:
      - '--config.my-cnf=/etc/mysql-exporter/my.cnf'
    volumes:
      - ./deploy/exporters/my.cnf:/etc/mysql-exporter/my.cnf:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${MYSQL_EXPORTER_PORT:-9104}:9104'
    networks: [mwops]

  # ---------------------------------------------------------------------------
  # PostgreSQL Exporter（端口 9187）
  #   被管目标：需预先创建只读监控账号
  #     CREATE USER exporter WITH PASSWORD 'xxx';
  #     GRANT pg_monitor TO exporter;
  #   关键指标：pg_stat_activity_count / pg_stat_database_xact_commit /
  #             pg_stat_database_blks_hit / pg_stat_database_blks_read /
  #             pg_replication_lag_seconds / pg_locks_count 等
  # ---------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: mwops-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${PG_TARGET_DSN:-postgresql://exporter:xxx@host.docker.internal:5432/postgres?sslmode=disable}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${PG_EXPORTER_PORT:-9187}:9187'
    networks: [mwops]

  # ---------------------------------------------------------------------------
  # Kafka Exporter（端口 9308）
  #   注意：kafka_exporter 不提供 instance_name 标签，需在 Prometheus 抓取配置里
  #   用 relabeling 补上（见 prometheus.with-exporters.yml），否则平台匹配不到实例
  # ---------------------------------------------------------------------------
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: mwops-kafka-exporter
    restart: unless-stopped
    command:
      - '--kafka.server=${KAFKA_TARGET_ADDR:-host.docker.internal:9092}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${KAFKA_EXPORTER_PORT:-9308}:9308'
    networks: [mwops]

  # ---------------------------------------------------------------------------
  # Elasticsearch Exporter（端口 9114）
  #   关键指标：elasticsearch_cluster_health_status / number_of_nodes /
  #             number_of_indices / unassigned_shards / jvm_memory_* 等
  # ---------------------------------------------------------------------------
  es-exporter:
    image: prometheuscommunity/elasticsearch-exporter:v1.7.0
    container_name: mwops-es-exporter
    restart: unless-stopped
    command:
      - '--es.uri=${ES_TARGET_URI:-http://host.docker.internal:9200}'
      - '--es.all'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${ES_EXPORTER_PORT:-9114}:9114'
    networks: [mwops]

  # ---------------------------------------------------------------------------
  # Nginx Exporter（端口 9113）
  #   前置条件：被管 Nginx 必须开启 stub_status，并允许 Exporter 访问
  #     location /stub_status { stub_status; allow <exporter-ip>; deny all; }
  # ---------------------------------------------------------------------------
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: mwops-nginx-exporter
    restart: unless-stopped
    command:
      - '--nginx.scrape-uri=${NGINX_STUB_STATUS_URI:-http://host.docker.internal/stub_status}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${NGINX_EXPORTER_PORT:-9113}:9113'
    networks: [mwops]

volumes:
  prometheus-data:
