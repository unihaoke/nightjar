# 中间件阈值告警规则（设计文档 4.4）。
#
# 说明：平台自身也内置了规则评估器（scheduler.metric_rule_eval_interval），
# 通过 PromQL 拉取指标后判定阈值。本文件用于「指标侧先行拦截 + 推送」的场景，
# 两者共用同一套收敛策略（指纹 + 窗口去重 + 冷却期），不会重复告警。

groups:
  - name: middleware-redis
    rules:
      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 85
        for: 5m
        labels:
          severity: critical
          mw_type: redis
        annotations:
          summary: 'Redis 内存使用率超过 85%'
          description: '实例 {{ $labels.instance_name }} 内存使用率 {{ printf "%.1f" $value }}%，存在触发 maxmemory 策略风险'

      - alert: RedisKeyspaceHitRateLow
        expr: rate(redis_keyspace_hits_total[5m]) / (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m])) * 100 < 90
        for: 10m
        labels:
          severity: warning
          mw_type: redis
        annotations:
          summary: 'Redis 命中率低于 90%'
          description: '实例 {{ $labels.instance_name }} 命中率 {{ printf "%.1f" $value }}%，缓存穿透压力可能传导至下游数据库'

  - name: middleware-kafka
    rules:
      - alert: KafkaConsumerLagHigh
        expr: sum by (instance_name) (kafka_consumergroup_lag) > 100000
        for: 5m
        labels:
          severity: critical
          mw_type: kafka
        annotations:
          summary: 'Kafka 消费积压超过 10 万'
          description: '消费组 {{ $labels.consumergroup }} Lag={{ $value }}，消费速率低于生产速率'

      - alert: KafkaUnderReplicatedPartitions
        expr: sum(kafka_topic_partition_under_replicated_partition) > 0
        for: 3m
        labels:
          severity: critical
          mw_type: kafka
        annotations:
          summary: '存在 ISR 副本不足分区'
          description: 'Broker {{ $labels.instance_name }} 存在副本不足分区，写入可靠性下降'

  - name: middleware-mysql
    rules:
      - alert: MySQLConnectionsHigh
        expr: mysql_global_status_threads_connected / mysql_global_variables_max_connections * 100 > 85
        for: 5m
        labels:
          severity: critical
          mw_type: mysql
        annotations:
          summary: 'MySQL 连接数接近上限'
          description: '实例 {{ $labels.instance_name }} 连接使用率 {{ printf "%.1f" $value }}%'

      - alert: MySQLSlowQueries
        expr: rate(mysql_global_status_slow_queries[5m]) > 5
        for: 5m
        labels:
          severity: warning
          mw_type: mysql
        annotations:
          summary: 'MySQL 慢查询速率升高'
          description: '实例 {{ $labels.instance_name }} 慢查询 {{ printf "%.2f" $value }}/s'

  - name: middleware-pg
    rules:
      - alert: PgConnectionsHigh
        expr: pg_stat_activity_count > 150
        for: 5m
        labels:
          severity: warning
          mw_type: pg
        annotations:
          summary: 'PostgreSQL 连接数偏高'
          description: '实例 {{ $labels.instance_name }} 当前连接 {{ $value }}'

      - alert: PgReplicationLag
        expr: pg_replication_lag_seconds > 30
        for: 5m
        labels:
          severity: critical
          mw_type: pg
        annotations:
          summary: 'PostgreSQL 主从延迟超过 30s'
          description: '从库 {{ $labels.instance_name }} 回放延迟 {{ $value }}s'

  - name: middleware-es
    rules:
      - alert: EsClusterNotGreen
        expr: elasticsearch_cluster_health_status < 2
        for: 5m
        labels:
          severity: critical
          mw_type: es
        annotations:
          summary: 'Elasticsearch 集群健康状态非 green'
          description: '集群 {{ $labels.instance_name }} 状态值 {{ $value }}（2=green, 1=yellow, 0=red）'

      - alert: EsHeapHigh
        expr: elasticsearch_jvm_memory_used_bytes{area="heap"} / elasticsearch_jvm_memory_max_bytes{area="heap"} * 100 > 85
        for: 5m
        labels:
          severity: warning
          mw_type: es
        annotations:
          summary: 'Elasticsearch JVM 堆使用率超过 85%'
          description: '节点 {{ $labels.name }} 堆使用率 {{ printf "%.1f" $value }}%，Full GC 风险升高'

  - name: middleware-nginx
    rules:
      - alert: NginxUpstreamErrorRate
        expr: rate(nginx_http_requests_total{status=~"5.."}[5m]) / rate(nginx_http_requests_total[5m]) * 100 > 2
        for: 3m
        labels:
          severity: critical
          mw_type: nginx
        annotations:
          summary: 'Nginx 5xx 错误率超过 2%'
          description: '实例 {{ $labels.instance_name }} 错误率 {{ printf "%.2f" $value }}%，请检查 upstream 健康状态'
