# Prometheus 采集配置。
#
# 职责（设计文档 4.2）：平台自身不实现采集器，指标统一由 Prometheus + 官方 Exporter
# 采集，平台通过 PromQL 查询。本文件负责：
#   1. 抓取平台自身指标（/metrics，见 10. 平台自身可观测性）；
#   2. 抓取「集成中心」创建的集成（middleware-integration，http_sd 服务发现）；
#   3. 加载告警规则（触发后通过 webhook 推送到平台 /api/hooks/alerts）。
#
# 注意：被管中间件的官方 Exporter 默认不在这里配置（见文件末尾的说明与示例）；
# 平台自带 Exporter 的场景请用 deploy/compose.middleware-exporters.yml 启动，
# 它会把本文件整体替换为 prometheus.with-exporters.yml。

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    platform: middleware-ops

rule_files:
  - /etc/prometheus/rules/*.yml

# 告警规则触发后推送到平台（事件驱动链路：阈值 → 异常事件 → AI 分析）
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  # 平台自身指标
  - job_name: middleware-ops
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8080']

  # ---------------------------------------------------------------------------
  # 集成中心（前端「集成中心」页保存的集成）
  #
  # 平台把每个集成渲染成一条服务发现目标（targets=Exporter 地址，
  # labels.instance_name=集成名称），通过 HTTP 服务发现暴露。
  # Prometheus 周期性拉取，因此**新增集成不需要重启或 reload Prometheus**。
  #
  # 为什么用 http_sd 而不是 file_sd 共享卷：后端容器以非 root 用户运行，
  # 共享命名卷的属主取决于「哪个容器先初始化该卷」，顺序不可控，
  # file_sd 会静默写不进去；HTTP 通道没有属主概念，跨主机也能用。
  # 平台同时在容器内保留 # /app/data/integrations/integrations.json 作为副产物。
  #
  # 集成的纳管实例 prom_job 会被写成 middleware-integration，
  # 与这里的 job_name 一致，平台按 {job,instance_name} 定位指标。
  # 若设置了 integration.sd_token，把令牌拼到 url 上：...?token=<令牌>
  # ---------------------------------------------------------------------------
  - job_name: middleware-integration
    http_sd_configs:
      - url: http://backend:8080/api/sd/integrations
        refresh_interval: 30s

  # ---------------------------------------------------------------------------
  # 被管中间件的官方 Exporter（示例，默认全部注释）
  #
  # 为什么默认注释掉：这些 job 指向的 Exporter 服务并不在基础 docker-compose.yml 里，
  # 开着它们只会得到一批 up=0 的 target；更麻烦的是它们带着硬编码的 instance_name
  # （redis-dev-01 / mysql-dev-01），一旦有同名容器被手工接入本网络就会"看似抓到了"，
  # 但标签值与平台实例名对不上——排查时会误以为是 relabel 没生效。
  #
  # 需要平台自带 Exporter 时，用 deploy/compose.middleware-exporters.yml 启动，
  # 它会把抓取配置整体换成 deploy/prometheus/prometheus.with-exporters.yml（各 job 带 relabel）。
  # 集成中心创建的集成走上面的 middleware-integration（http_sd），不依赖这里。
  #
  # - job_name: middleware-exporter-redis
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
  #       labels:
  #         instance_name: redis-dev-01
  #
  # - job_name: middleware-exporter-mysql
  #   static_configs:
  #     - targets: ['mysqld-exporter:9104']
  #       labels:
  #         instance_name: mysql-dev-01
  # ---------------------------------------------------------------------------

