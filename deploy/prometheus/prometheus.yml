# Prometheus 采集配置。
#
# 职责（设计文档 4.2）：平台自身不实现采集器，指标统一由 Prometheus + 官方 Exporter
# 采集，平台通过 PromQL 查询。本文件负责：
#   1. 抓取平台自身指标（/metrics，见 10. 平台自身可观测性）；
#   2. 抓取被管中间件的官方 Exporter（按 job 命名约定 middleware-exporter-<类型>，
#      与 config.prometheus.exporter_job_prefix 对应）；
#   3. 加载告警规则（触发后通过 webhook 推送到平台 /api/hooks/alerts）。

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    platform: middleware-ops

rule_files:
  - /etc/prometheus/rules/*.yml

# 告警规则触发后推送到平台（事件驱动链路：阈值 → 异常事件 → AI 分析）
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  # 平台自身指标
  - job_name: middleware-ops
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8080']

  # ---------------------------------------------------------------------------
  # 集成中心（前端「集成中心」页保存的集成）
  #
  # 平台把每个集成渲染成一条服务发现目标（targets=Exporter 地址，
  # labels.instance_name=集成名称），通过 HTTP 服务发现暴露。
  # Prometheus 周期性拉取，因此**新增集成不需要重启或 reload Prometheus**。
  #
  # 为什么用 http_sd 而不是 file_sd 共享卷：后端容器以非 root 用户运行，
  # 共享命名卷的属主取决于「哪个容器先初始化该卷」，顺序不可控，
  # file_sd 会静默写不进去；HTTP 通道没有属主概念，跨主机也能用。
  # 平台同时在容器内保留 # /app/data/integrations/integrations.json 作为副产物。
  #
  # 集成的纳管实例 prom_job 会被写成 middleware-integration，
  # 与这里的 job_name 一致，平台按 {job,instance_name} 定位指标。
  # 若设置了 integration.sd_token，把令牌拼到 url 上：...?token=<令牌>
  # ---------------------------------------------------------------------------
  - job_name: middleware-integration
    http_sd_configs:
      - url: http://backend:8080/api/sd/integrations
        refresh_interval: 30s

  # Redis Exporter（示例：按实际部署替换 targets）
  - job_name: middleware-exporter-redis
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          instance_name: redis-dev-01

  # MySQL Exporter
  - job_name: middleware-exporter-mysql
    static_configs:
      - targets: ['mysqld-exporter:9104']
        labels:
          instance_name: mysql-dev-01

  # PostgreSQL Exporter
  - job_name: middleware-exporter-pg
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          instance_name: pg-dev-01

  # Kafka Exporter
  - job_name: middleware-exporter-kafka
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels:
          instance_name: kafka-dev-01

  # Elasticsearch Exporter
  - job_name: middleware-exporter-es
    static_configs:
      - targets: ['es-exporter:9114']
        labels:
          instance_name: es-dev-01

  # Nginx Exporter
  - job_name: middleware-exporter-nginx
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          instance_name: nginx-dev-01
