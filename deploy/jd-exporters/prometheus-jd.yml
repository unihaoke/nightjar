# jd 项目 Prometheus 抓取配置（原 jd 配置 + 中间件 Exporter 任务）
#
# 由 deploy/jd-exporters/docker-compose.jd.yml 挂载覆盖 jd 原有的
# monitoring/prometheus/prometheus.yml（仅在启用 nightjar 接入时生效）。
#
# ⚠️ 关键修正：nightjar 的 internal/monitor/profile.go:buildSelector 在没有配置
#    prom_instance 时用 instance_name="<实例名>" 过滤，因此两个中间件 job 的每条
#    时序都必须带上 instance_name 标签。
#
#    - mysqld_exporter 本身不带实例名 → 必须 relabel；
#    - redis_exporter 也不带：oliver006/redis_exporter 全量 flag 列表里
#      **没有 SERVICE_NAME 这一项**（只有 REDIS_ADDR / REDIS_PASSWORD / ...），
#      所以早期版本靠 SERVICE_NAME 环境变量上报 instance_name 是无效的。
#
#    结论：两个 job 统一用 relabel_configs 硬写 instance_name，不依赖 Exporter 行为。
#
# 上游来源：https://github.com/unihaoke/nightjar

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  # === jd 原配置：Spring Boot 后端（Actuator + Micrometer Prometheus）===
  - job_name: 'interview-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    # 超时必须小于抓取间隔，否则一次慢抓取会挤压下一轮，造成监控数据断点
    scrape_timeout: 8s
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: 'interview-review-backend'

  # === jd 原配置：Prometheus 自身指标 ===
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # === 新增：Redis 中间件指标 ===
  #   nightjar 纳管实例名必须填 jd-redis
  - job_name: 'middleware-exporter-redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance_name
        replacement: jd-redis

  # === 新增：MySQL 中间件指标 ===
  #   nightjar 纳管实例名必须填 jd-mysql
  - job_name: 'middleware-exporter-mysql'
    static_configs:
      - targets: ['mysqld-exporter:9104']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance_name
        replacement: jd-mysql
