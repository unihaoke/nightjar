# =============================================================================
# jd 接入 nightjar · 方案 A：复用 jd 自带 Prometheus（推荐）
# 上游仓库：https://github.com/unihaoke/nightjar
#
# 本文件是 docker-compose.yml 的 overlay（增量覆盖），只做「追加」，不改动原文件：
#   1. mysql / redis / prometheus 追加 jd-nightjar 专用互联网络的成员身份与别名；
#   2. prometheus 抓取配置替换为「jd 原配置 + 中间件 Exporter 任务」；
#   3. 新增 redis-exporter / mysqld-exporter，只加入数据面 jd-data（无出网、无宿主端口）；
#   4. mysql-monitor-user 一次性任务（initdb profile）补建只读监控账号；
#   5. jd-log-agent（logs profile）把应用/GC 日志推给 nightjar 的 /api/hooks/logs。
#
# 【保留原生启动】不加 -f 本文件时，docker compose up -d --build 行为与接入前完全一致。
#
# ---- 网络隔离模型（关键）---------------------------------------------------
#   jd-data      internal 数据面：backend / mysql / redis / 两个 Exporter（无出网）
#   jd-obs       监控面：prometheus / grafana / backend
#   jd-nightjar  internal 专用互联网络（external，由 start.sh 预先创建）：
#                   jd 侧成员   mysql(jd-mysql) / redis(jd-redis) /
#                               prometheus(jd-prometheus) / jd-log-agent
#                   nightjar 侧 mwops-backend / mwops-frontend（见 nightjar 的
#                               deploy/compose.jd-link.yml）
#
#   nightjar 因此只能做三件事：查 Prometheus(9090)、TCP 探测 3306/6379、收日志；
#   它看不到 frontend / grafana / backend 的 AI 出网链路，jd 的数据库也依旧零宿主暴露。
#
#   注意 jd-nightjar 必须是 internal 网络（docker network create --internal），
#   否则 mysql / redis 会因为多了一张非 internal 网卡而重新获得出网路由。
#
# 使用方式（在 jd 项目根目录执行）：
#   ./start.sh nightjar                # 等价于下面这行
#   docker compose -f docker-compose.yml -f deploy/jd-exporters/docker-compose.jd.yml up -d --build
#   docker compose -f docker-compose.yml -f deploy/jd-exporters/docker-compose.jd.yml \
#     --profile initdb run --rm mysql-monitor-user       # 已有数据卷时补建只读账号
#   docker compose -f docker-compose.yml -f deploy/jd-exporters/docker-compose.jd.yml \
#     --profile logs up -d                               # 启用日志上报
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # MySQL：加入专用互联网络，供 nightjar 做 TCP 健康探测（3306）
  #   别名 jd-mysql —— nightjar 纳管时「连接地址」就填它
  # ---------------------------------------------------------------------------
  mysql:
    networks:
      jd-nightjar:
        aliases:
          - jd-mysql

  # ---------------------------------------------------------------------------
  # Redis：同上，别名 jd-redis
  # ---------------------------------------------------------------------------
  redis:
    networks:
      jd-nightjar:
        aliases:
          - jd-redis

  # ---------------------------------------------------------------------------
  # Prometheus：追加互联网络（别名 jd-prometheus）+ 替换抓取配置
  #   nightjar 的 prometheus.base_url 填 http://jd-prometheus:9090
  # ---------------------------------------------------------------------------
  prometheus:
    volumes:
      - ./deploy/jd-exporters/prometheus-jd.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      jd-nightjar:
        aliases:
          - jd-prometheus

  # ---------------------------------------------------------------------------
  # Redis Exporter：只加数据面 jd-data
  #   无宿主端口映射，外部一律经 Prometheus 间接访问
  #   instance_name=jd-redis 由 prometheus-jd.yml 的 relabel 补齐
  #   （redis_exporter 不支持 SERVICE_NAME，必须靠 relabel）
  # ---------------------------------------------------------------------------
  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: jd-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-jd_redis_change_me}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - jd-data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # MySQL Exporter：只加数据面 jd-data
  #   口令由 .env 的 MYSQL_EXPORTER_PASSWORD 注入，与 init/01-monitor-user.sql 一致
  # ---------------------------------------------------------------------------
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: jd-mysqld-exporter
    restart: unless-stopped
    environment:
      # 口令含 @ ( ) / 等特殊字符时改用 my.cnf 挂载方式（见该文件头部注释）
      DATA_SOURCE_NAME: exporter:${MYSQL_EXPORTER_PASSWORD:-exporter_change_me}@(mysql:3306)/
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - jd-data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # 一次性任务：给已存在的 MySQL 数据卷补建只读监控账号
  #   docker compose -f docker-compose.yml -f <本文件> --profile initdb run --rm mysql-monitor-user
  # ---------------------------------------------------------------------------
  mysql-monitor-user:
    image: mysql:8.0
    container_name: jd-mysql-monitor-user
    profiles: ['initdb']
    entrypoint: ['/bin/sh', '-c']
    # $$ 是 compose 的转义写法，容器内看到的才是 ${DB_PASS}
    command:
      - 'mysql -h mysql -P 3306 -uroot -p"$${DB_PASS}" < /init/01-monitor-user.sql && echo ">> monitor user ready"'
    environment:
      DB_PASS: ${DB_PASS:-root}
    volumes:
      - ./deploy/jd-exporters/init:/init:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - jd-data

  # ---------------------------------------------------------------------------
  # 日志上报（可选）：把 backend-logs 卷里的 error.log / gc.log 推给 nightjar
  #   docker compose -f docker-compose.yml -f <本文件> --profile logs up -d
  #
  #   走 nightjar 的 /api/hooks/logs，令牌与 nightjar 的 HOOK_TOKEN 一致。
  #   只挂日志卷 + 只连 jd-nightjar，不接触数据面。
  # ---------------------------------------------------------------------------
  jd-log-agent:
    # 注意：curl 必须在构建期装好——本服务只连 internal 网络，运行时没有出网能力
    build:
      context: ./deploy/jd-exporters
      dockerfile: Dockerfile.logagent
    image: jd-log-agent:latest
    container_name: jd-log-agent
    profiles: ['logs']
    restart: unless-stopped
    environment:
      NIGHTJAR_URL: ${NIGHTJAR_URL:-http://mwops-backend:8080}
      NIGHTJAR_HOOK_TOKEN: ${NIGHTJAR_HOOK_TOKEN:-}
      SERVICE_NAME: interview-review-backend
      SERVER_NAME: ${SERVER_NAME:-jd-host}
      ENVIRONMENT: dev
      # 分号分隔的 文件:告警类型:级别 三元组。
      # 默认只采集 error.log：gc.log 逐行上报会打爆日志告警列表（每行一个事件），
      # 需要 GC 诊断时再按需追加（并先把 JVM 参数收敛为 -Xlog:gc）：
      #   LOG_TARGETS: /logs/error.log:error:ERROR;/logs/gc.log:gc:INFO
      LOG_TARGETS: ${LOG_TARGETS:-/logs/error.log:error:ERROR}
    volumes:
      - backend-logs:/logs:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - jd-nightjar

networks:
  # 跨项目专用互联网络。由 start.sh 以 --internal 创建；两个 compose 项目都以
  # external 方式引用同一个名字，谁先起谁负责创建。
  jd-nightjar:
    external: true
    name: ${JD_NIGHTJAR_NETWORK:-jd-nightjar}
