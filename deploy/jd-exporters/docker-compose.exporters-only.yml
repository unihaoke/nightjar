# =============================================================================
# jd 接入 nightjar · 方案 B：独立 Prometheus + 独立 Exporter（不动 jd 原生服务形态）
# 上游仓库：https://github.com/unihaoke/nightjar
#
# 适用：
#   - 完全不想覆盖 jd 的 Prometheus 抓取配置；
#   - 或 jd 用 sqlite profile 启动（没有 mysql 服务，此时只起 redis-exporter）。
#
# 与改造前的差异：jd 的网络已分区，因此本文件不再加入整张 interview-net，
# 而是**只加入数据面 jd-data**（external，internal 网络）——Exporter 能连到
# mysql:3306 / redis:6379，但看不到 frontend / grafana，也不向宿主发布数据库端口。
#
# 使用方式（在 jd 项目根目录执行，确保 jd 原生 compose 已启动）：
#   ./start.sh exporters-only
#   # 等价写法
#   JD_DATA_NETWORK=<实际网络名> \
#     docker compose -f deploy/jd-exporters/docker-compose.exporters-only.yml up -d
#   # 只接 Redis（sqlite profile 场景）
#   docker compose -f deploy/jd-exporters/docker-compose.exporters-only.yml up -d redis-exporter prometheus-jd
#   # 补建 MySQL 只读监控账号
#   docker compose -f deploy/jd-exporters/docker-compose.exporters-only.yml \
#     --profile initdb run --rm mysql-monitor-user
#
# 随后在 nightjar 侧把 prometheus.base_url 指向 http://jd-prometheus:9190。
#
# ⚠️ 已知限制：方案 B 不会把 mysql / redis 容器加进 jd-nightjar，因此 nightjar 的
#    TCP 健康探测会显示「连接失败」（status=0）；指标查询与 AI 诊断不受影响。
#    若希望探测也正常，额外叠加网络专用 overlay（不改动任何服务行为）：
#      docker compose -f docker-compose.yml \
#        -f deploy/jd-exporters/docker-compose.jd-link.yml \
#        -f deploy/jd-exporters/docker-compose.exporters-only.yml up -d
# =============================================================================

services:
  prometheus-jd:
    image: prom/prometheus:v2.54.1
    container_name: jd-prometheus-middleware
    restart: unless-stopped
    ports:
      - '${JD_PROM_PORT:-9190}:9090'
    volumes:
      - ./deploy/jd-exporters/prometheus-standalone.yml:/etc/prometheus/prometheus.yml:ro
      - jd-mw-prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      jd-mw:
      jd-nightjar:
        aliases:
          - jd-prometheus

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: jd-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-jd_redis_change_me}
    # 方案 B 下端口映射到宿主，便于直接 curl 验证；生产可去掉
    ports:
      - '127.0.0.1:${JD_REDIS_EXPORTER_PORT:-9121}:9121'
    networks:
      - jd-data
      - jd-mw

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: jd-mysqld-exporter
    restart: unless-stopped
    environment:
      # 跨 compose 项目时服务名 mysql 不一定可解析，用 jd 的 container_name 更稳
      DATA_SOURCE_NAME: exporter:${MYSQL_EXPORTER_PASSWORD:-exporter_change_me}@(interview-mysql:3306)/
    ports:
      - '127.0.0.1:${JD_MYSQL_EXPORTER_PORT:-9104}:9104'
    networks:
      - jd-data
      - jd-mw

  # ---------------------------------------------------------------------------
  # 独立启动时 MySQL 里还没有只读监控账号，用一次性容器补建：
  #   docker compose -f <本文件> --profile initdb run --rm mysql-monitor-user
  # ---------------------------------------------------------------------------
  mysql-monitor-user:
    image: mysql:8.0
    container_name: jd-mysql-monitor-user
    profiles: ['initdb']
    entrypoint: ['/bin/sh', '-c']
    # $$ 是 compose 的转义写法；用 container_name 直连，跨 compose 项目也能解析
    command:
      - 'mysql -h interview-mysql -P 3306 -uroot -p"$${DB_PASS}" < /init/01-monitor-user.sql && echo ">> monitor user ready"'
    environment:
      DB_PASS: ${DB_PASS:-root}
    volumes:
      - ./deploy/jd-exporters/init:/init:ro
    networks:
      - jd-data

volumes:
  jd-mw-prometheus-data:

networks:
  # jd 的数据面网络（internal）。名称形如 <compose项目名>_jd-data，默认 jd_jd-data。
  # 用 docker network ls | grep jd-data 确认，不同时用 JD_DATA_NETWORK 覆盖。
  jd-data:
    external: true
    name: ${JD_DATA_NETWORK:-jd_jd-data}
  # 本方案自建的监控网：Exporter 与独立 Prometheus 在此互通，并用于发布 9190
  jd-mw:
    driver: bridge
  # 跨项目专用互联网络（external，由 start.sh 以 --internal 创建）
  jd-nightjar:
    external: true
    name: ${JD_NIGHTJAR_NETWORK:-jd-nightjar}
