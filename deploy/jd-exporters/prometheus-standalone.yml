# 独立版 Prometheus 配置（供 deploy/jd-exporters/docker-compose.exporters-only.yml 使用）
#
# 与 jd 自带的 9090 实例相互独立（端口 9190），只抓中间件 Exporter + jd 后端应用指标；
# 若愿意复用 jd 自带的 Prometheus，请改用 prometheus-jd.yml 覆盖方案。
#
# instance_name 必须用 relabel 硬写：nightjar 的 buildSelector 依赖该标签，
# 而两个 Exporter 都不会自己上报它（redis_exporter 没有 SERVICE_NAME 这个 flag）。
# 上游来源：https://github.com/unihaoke/nightjar

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  # Redis 中间件指标
  - job_name: 'middleware-exporter-redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance_name
        replacement: jd-redis

  # MySQL 中间件指标
  - job_name: 'middleware-exporter-mysql'
    static_configs:
      - targets: ['mysqld-exporter:9104']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance_name
        replacement: jd-mysql

  # 同时抓 jd 后端的应用指标（Actuator），便于在 nightjar 侧关联应用与中间件
  - job_name: 'interview-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    scrape_timeout: 8s
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: 'interview-review-backend'
