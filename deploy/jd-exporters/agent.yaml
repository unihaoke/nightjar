# nightjar 官方日志采集 Agent 的配置模板（生产推荐）
#
# 构建与运行（Agent 只依赖 Go 标准库，交叉编译后可直接投放）：
#   cd nightjar/middleware-ops && go build -o mwops-agent ./cmd/agent
#
#   docker run -d --name jd-log-agent \
#     --network jd-nightjar \
#     -v jd_backend-logs:/logs:ro \
#     -v "$PWD/deploy/jd-exporters/agent.yaml:/etc/mwops-agent/agent.yaml:ro" \
#     -v jd_agent_position:/data \
#     --restart unless-stopped \
#     <mwops-agent 镜像> -config /etc/mwops-agent/agent.yaml
#
# 不想自制镜像时，可先用同目录的 log-shipper.sh（alpine + curl 逐行上报，
# 由 docker-compose.jd.yml 的 jd-log-agent 服务以 profile=logs 启用）。

platform_url: http://mwops-backend:8080
hook_token: ""            # 与 nightjar 的 HOOK_TOKEN 一致
service: interview-review-backend
environment: dev
server_name: jd-host
position_file: /data/agent-position.json
context_lines: 20
max_batch: 50

files:
  # 应用错误日志（logback-spring.xml 的 ERROR_FILE）
  - path: /logs/error.log
    alert_type: error
    service: interview-review-backend
    level_filter: ERROR

  # GC 日志（backend/Dockerfile 的 -Xlog:gc*:file=/app/data/logs/gc.log）
  - path: /logs/gc.log
    alert_type: gc
    service: interview-review-backend
    level_filter: INFO
