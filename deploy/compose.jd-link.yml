# =============================================================================
# nightjar ⇄ 跨栈项目（以 jd 为例）专用互联 overlay
#
# 作用：把 nightjar 的 backend 加入目标项目创建的 internal 网络 jd-nightjar，
#       使平台具备以下最小必要通路，且**仅**这些：
#
#   1. mwops-backend → jd-mysql:3306 / jd-redis:6379
#        纳管实例的 TCP 健康探测与「集成核验」（service/integration.go:probeIntegration）
#   2. mwops-exporter-* → jd-mysql:3306 / jd-redis:6379
#        Exporter 容器由平台创建，自动加入 mwops + jd-nightjar 两张网，抓取由
#        平台自带 Prometheus 在 mwops 上完成（见 INTEGRATION_EXPORTER_NETWORK）
#
# 指标、大盘、告警、日志采集全部由 nightjar 侧承担；目标项目不跑任何监控组件，
# 只通过它自己的 overlay（jd/deploy/nightjar-link.yml）暴露网络别名与日志卷。
#
# 为什么不是把两个栈丢进同一张大网：
#   目标项目的 frontend / backend 出网链路完全不暴露给 nightjar；
#   其 MySQL / Redis 也依旧不向宿主机发布端口。跨栈可见面只有上面两个端点。
#
# 前置：目标项目侧已执行 ./start.sh nightjar（该脚本会以 --internal 创建 jd-nightjar）。
#       网络不存在时本文件会启动失败——这是有意的，避免退化成非隔离的普通桥接网。
#
# ---- 网络不一致是本接入最常见的故障（先看这里）-----------------------------
#   本 overlay 是**必须**的：没有它，mwops-backend 不在 jd-nightjar 上，会同时出现
#     「集成核验连接失败」+「Exporter 解析不了 jd-mysql / jd-redis」两种现象，
#     而 Prometheus 侧只表现为一条 up=0 的目标。
#   注意：mwops-prometheus 不在本网络上（保持最小可见面）。
#
#   体检：bash scripts/doctor-jd-link.sh（逐条对照期望拓扑并给出修复命令）
#
# 用法（在 nightjar 项目根目录执行，推荐直接用脚本）：
#   ./scripts/setup-jd-link.sh
# 等价的手工方式：
#   cp .env.example .env        # 至少设置 JWT_SECRET / ADMIN_PASSWORD
#   docker compose -f docker-compose.yml -f deploy/compose.jd-link.yml up -d --build
# =============================================================================

services:
  backend:
    environment:
      # 平台自带 Prometheus 在 mwops 网络上，与 jd 侧无关
      MWOPS_PROMETHEUS_BASE_URL: ${MWOPS_PROMETHEUS_BASE_URL:-http://prometheus:9090}
    networks:
      - mwops
      - jd-nightjar

networks:
  # 目标项目创建的 internal 网络，本文件以 external 方式引用（不负责创建）
  jd-nightjar:
    external: true
    name: ${JD_NIGHTJAR_NETWORK:-jd-nightjar}
